<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - CMS App</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #005DAC;
            --primary-dark: #004A8A;
            --surface: #F8FAFC;
            --white: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        body {
            font-family: 'Plus+Jakarta+Sans', sans-serif;
            background-color: var(--surface);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--white);
            max-width: 400px;
            width: 100%;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(0, 93, 172, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon {
            width: 40px;
            height: 40px;
            fill: var(--primary);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px;
        }

        p {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0 0 32px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 99px;
            font-weight: 600;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .loading {
            display: block;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-muted);
        }

        #fallback {
            margin-top: 24px;
            font-size: 14px;
            display: none;
        }

        .manual-link {
            word-break: break-all;
            background: #F1F5F9;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 12px;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-box">
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
    </div>
    <h1 id="title">Opening CMS App...</h1>
    <p id="message">We're redirecting you to the app to securely reset your password.</p>
    
    <button id="openBtn" class="btn">Open App Now</button>
    <div id="loadingText" class="loading">Trying to launch app...</div>

    <div id="fallback">
        <p>If the app didn't open automatically, click the button above or copy the link below:</p>
        <div id="manualUrl" class="manual-link"></div>
    </div>
</div>

<script>
    function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    const token = getQueryParam('token');
    const deepLink = `cmsapp://app/reset-password?token=${token}`;

    function attemptRedirect() {
        if (!token) {
            document.getElementById('title').innerText = "Invalid Link";
            document.getElementById('message').innerText = "The reset token is missing. Please request a new link.";
            document.getElementById('openBtn').style.display = "none";
            document.getElementById('loadingText').style.display = "none";
            return;
        }

        // Display manual URL for fallback
        document.getElementById('manualUrl').innerText = deepLink;

        // Attempt redirect
        window.location.href = deepLink;

        // Show fallback after 3 seconds
        setTimeout(() => {
            document.getElementById('loadingText').style.display = "none";
            document.getElementById('fallback').style.display = "block";
            document.getElementById('title').innerText = "Reset Password";
        }, 3000);
    }

    document.getElementById('openBtn').addEventListener('click', () => {
        window.location.href = deepLink;
    });

    // Auto-attempt on load
    window.onload = attemptRedirect;
</script>

</body>
</html>
