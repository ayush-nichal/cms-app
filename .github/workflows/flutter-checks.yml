name: Flutter Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Set up .env placeholder
      run: |
        mkdir -p app/assets
        echo "API_BASE_URL=http://localhost:3000" > app/assets/.env
        
    - name: Install dependencies
      working-directory: ./app
      run: flutter pub get
      
    - name: Analyze project source
      working-directory: ./app
      run: flutter analyze
      
    - name: Run tests
      working-directory: ./app
      run: flutter test
